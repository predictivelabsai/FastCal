[project]
name = "fastcal"
version = "0.2.0"
description = "FastCal team scheduling and public booking"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "cryptography>=45",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.0",
    "python-fasthtml>=0.12",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fastcal*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "F403", "F405", "F811"]
